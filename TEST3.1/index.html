<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skilvex</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="form-container">
        <!-- LOGO HEADER -->
        <div class="brand-header">
            <h1 class="wordmark">Skilvex</h1>
            <p>Welcome to the campus network</p>
        </div>

        <!-- LOGIN FORM -->
        <form id="login-form" class="active-form">
            <h2>Sign In</h2>
            <div class="input-group">
                <label for="login-email">Email Address</label>
                <input type="email" id="login-email" placeholder="Enter your email" required>
            </div>
            
            <div class="input-group">
                <label for="login-password">Password</label>
                <input type="password" id="login-password" placeholder="Enter your password" required>
            </div>

            <div class="input-group">
                <label for="login-role">Select Role</label>
                <select id="login-role">
                    <option value="" disabled selected>Choose your role...</option>
                    <option value="student">Student</option>
                    <option value="admin">TPO / Admin</option>
                </select>
            </div>

            <button type="submit" class="primary-btn">Login</button>
            
            <div class="toggle-text">
                Don't have an account? <span id="show-register" class="text-link">Sign Up</span>
            </div>
        </form>

        <!-- REGISTRATION FORM -->
        <form id="register-form" class="hidden">
            <h2>Create Account</h2>
            
            <div class="input-group">
                <label for="reg-name">Full Name</label>
                <input type="text" id="reg-name" placeholder="John Doe" required>
            </div>

            <div class="input-group">
                <label for="reg-email">Email Address</label>
                <input type="email" id="reg-email" placeholder="name@gmail.com" required>
                <span id="email-error" class="error-text">Must be @gmail.com or @outlook.com</span>
            </div>

            <div class="input-group">
                <label for="reg-phone">Phone Number</label>
                <input type="number" id="reg-phone" placeholder="10-digit mobile number" required>
                <span id="phone-error" class="error-text">Must be exactly 10 digits</span>
            </div>

            <div class="input-group">
                <label for="reg-role">Select Role</label>
                <select id="reg-role" required>
                    <option value="" disabled selected>Choose your role...</option>
                    <option value="student">Student</option>
                    <option value="admin">TPO / Admin</option>
                </select>
            </div>

            <button type="submit" id="register-btn" class="primary-btn">Register Profile</button>
            
            <div class="toggle-text">
                Already have an account? <span id="show-login" class="text-link">Log In</span>
            </div>
        </form>
    </div>

    <div class="hero-footer">Built for The Code Architects · Skilvex prototype</div>

    <script src="script.js"></script>
</body>
</html>
